# Put this in /etc/nginx/sites-available/kmester and enable it with nginx.
# Replace kaloria.example.com with the real domain.
server {
    listen 80;
    listen [::]:80;
    server_name kaloria.example.com;

    # Certbot may manage the HTTPS redirect and certificate directives here.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
